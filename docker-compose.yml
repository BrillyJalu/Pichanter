# Deploy Pichanter di home server -> https://pichanter.jalulabs.my.id (publik, tanpa login).
# HTTPS lewat Cloudflare Tunnel jalulabs yang SUDAH berjalan di server; tidak ada tunnel baru di sini.
# Panduan lengkap: DEPLOY.md.
services:
  pichanter:
    build: .
    image: pichanter:latest
    container_name: pichanter
    restart: unless-stopped
    environment:
      ALLOW_PLACEHOLDER: "false"          # model gagal dimuat -> 503, bukan model sementara
      CORS_ORIGINS: https://pichanter.jalulabs.my.id
      MODEL_THREADS: ${MODEL_THREADS:-4}
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
    volumes:
      - pichanter-data:/data
    # Sama seperti KuisKilat (172.17.0.1:3000): terikat ke IP bridge Docker, bisa dijangkau cloudflared
    # di host maupun di container, tetapi tidak terbuka ke LAN/internet secara langsung.
    # Set PICHANTER_BIND=0.0.0.0 di .env hanya bila perlu diakses dari LAN (cadangan saat internet putus).
    ports:
      - "${PICHANTER_BIND:-172.17.0.1}:${PICHANTER_PORT:-8010}:8000"

volumes:
  pichanter-data:
